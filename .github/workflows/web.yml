name: web

on:
  pull_request:
    paths:
      - apps/web/**
      - contracts/api/**
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - contracts/api/**
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Os tipos da API são gerados do contrato; divergência significa schema.d.ts desatualizado.
      - name: Generated API types match the contract
        run: |
          npm run generate:api
          git diff --exit-code -- api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
